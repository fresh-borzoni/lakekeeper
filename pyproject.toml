[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylakekeeper"
version = "0.1.0"
description = "Python client for Lakekeeper datasets"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# Reading data needs a filesystem.
s3 = ["s3fs>=2023.1"]

[tool.hatch.build.targets.wheel]
packages = ["pylakekeeper"]
